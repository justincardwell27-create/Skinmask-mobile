<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Skin Mask Mobile</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#101218;color:#f4f5f8}main{max-width:740px;margin:auto;padding:16px 16px 50px}h1{font-size:1.45rem;margin:4px 0}p{color:#adb5c5;font-size:.9rem;line-height:1.45}.panel{background:#1b1e28;border:1px solid #34394a;border-radius:16px;padding:14px;margin:13px 0}.pick{display:block;text-align:center;background:#5667e8;color:white;border-radius:12px;padding:15px;font-weight:700;cursor:pointer}input[type=file]{display:none}button,select{background:#34394a;color:white;border:1px solid #50576b;border-radius:10px;padding:12px;font:inherit}button:disabled{opacity:.4}button.primary{background:#5667e8;border-color:#5667e8;font-weight:700;width:100%}.effects{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.effects button.active{background:#5667e8;border-color:#a6adff}label{display:block;margin:12px 0 6px;font-weight:650;font-size:.94rem}input[type=range]{width:100%;accent-color:#8b97ff}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checks label{font-weight:500;margin:0;background:#272b38;border-radius:10px;padding:12px;font-size:.9rem}.checks input{accent-color:#8b97ff}canvas{display:block;width:100%;height:auto;max-height:65vh;object-fit:contain;border-radius:12px;background:#292e3b}.status{min-height:22px;color:#bfc7d9;font-size:.85rem}.toolbar{display:flex;gap:8px}.toolbar button{flex:1}.muted{font-size:.78rem}#previewPanel{display:none}#original{display:none}#strengthValue{float:right;color:#b6c1ff}#modelStatus{font-size:.8rem;color:#c7d0e3}</style></head><body><main><h1>Skin Mask Mobile</h1><p>Automatic image censorship with Mosaic, Blur, and TV Static. Images stay on your device.</p><div class="panel"><label class="pick" for="file">Choose image from phone</label><input id="file" type="file" accept="image/*"><p id="modelStatus">AI model loads when you select an image. Internet and an HTTPS-hosted page are recommended on Android.</p></div><section id="previewPanel"><div class="panel"><canvas id="preview"></canvas><canvas id="original"></canvas><p class="status" id="status" aria-live="polite"></p></div><div class="panel"><label>Effect</label><div class="effects"><button data-effect="mosaic" class="active">Mosaic</button><button data-effect="blur">Blur</button><button data-effect="static">TV Static</button></div><label for="strength">Strength <span id="strengthValue">65</span></label><input id="strength" type="range" min="10" max="100" value="65"><label>Automatically censor</label><div class="checks"><label><input type="checkbox" id="face" checked> Face & skin</label><label><input type="checkbox" id="body" checked> Body skin</label><label><input type="checkbox" id="hair"> Hair</label><label><input type="checkbox" id="clothes"> Clothing</label></div><label for="padding">Coverage expansion</label><input id="padding" type="range" min="0" max="16" value="3"><p class="muted">AI segmentation is approximate. Check the preview for missed areas before sharing.</p><div class="toolbar"><button id="detect">Re-detect</button><button id="reset">Original</button></div><br><button class="primary" id="save">Save censored image</button></div></section></main><script type="module">
const $=id=>document.getElementById(id);const preview=$('preview'),orig=$('original');const pc=preview.getContext('2d',{willReadFrequently:true}),oc=orig.getContext('2d',{willReadFrequently:true});let segmenter=null,source=null,labels=null,mask=null,effect='mosaic',showOriginal=false,renderPending=false;const TASKS='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22';const MODEL='https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/1/selfie_multiclass_256x256.tflite';
function status(t){$('status').textContent=t}function schedule(){if(!renderPending){renderPending=true;requestAnimationFrame(()=>{renderPending=false;render()})}}async function loadAI(){if(segmenter)return; $('modelStatus').textContent='Loading AI segmentation model…';let vision;
for(const url of [
 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm',
 'https://esm.sh/@mediapipe/tasks-vision@0.10.22'
]){
 try {vision=await import(url);break}
 catch(error){console.warn('AI module source unavailable:',url,error)}
}
if(!vision)throw Error('AI libraries could not load. Android content:// files can block external modules. Open this editor from an HTTPS site (for example GitHub Pages), ensure you are online, then tap Re-detect.'); 
const {ImageSegmenter,FilesetResolver}=vision;const files=await FilesetResolver.forVisionTasks(TASKS+'/wasm');segmenter=await ImageSegmenter.createFromOptions(files,{baseOptions:{modelAssetPath:MODEL,delegate:'CPU'},runningMode:'IMAGE',outputCategoryMask:true,outputConfidenceMasks:false});$('modelStatus').textContent='AI ready. Processing stays on your device.'}
function maskFromResult(result){const cm=result.categoryMask;if(!cm)throw Error('Model returned no segmentation mask');const arr=cm.getAsUint8Array(),w=cm.width,h=cm.height;const selected=new Uint8Array(w*h);const face=$('face').checked,body=$('body').checked,hair=$('hair').checked,clothes=$('clothes').checked;for(let i=0;i<arr.length;i++){const c=arr[i];selected[i]=(face&&c===3)||(body&&c===2)||(hair&&c===1)||(clothes&&c===4)?255:0}cm.close();return {selected,w,h}}
async function detect(){if(!source)return;try{status('Detecting regions…');await loadAI();const result=segmenter.segment(orig);mask=maskFromResult(result);result.close();showOriginal=false;status('Detection complete. Review coverage before saving.');schedule()}catch(e){status('Detection failed: '+e.message);console.error(e)}}
function dilate(data,w,h,r){if(r===0)return data;let out=new Uint8Array(data.length);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let found=0;for(let dy=-r;dy<=r&&!found;dy++){let yy=y+dy;if(yy<0||yy>=h)continue;for(let dx=-r;dx<=r;dx++){let xx=x+dx;if(xx>=0&&xx<w&&data[yy*w+xx]){found=255;break}}}out[y*w+x]=found}return out}
function render(){if(!source)return;preview.width=orig.width;preview.height=orig.height;pc.drawImage(orig,0,0);if(showOriginal||!mask)return;const w=preview.width,h=preview.height;const strength=+$('strength').value;const temp=document.createElement('canvas');temp.width=w;temp.height=h;const tc=temp.getContext('2d',{willReadFrequently:true});if(effect==='mosaic'){const scale=Math.max(3,Math.round(4+strength*.48));const tiny=document.createElement('canvas');tiny.width=Math.max(1,Math.ceil(w/scale));tiny.height=Math.max(1,Math.ceil(h/scale));tiny.getContext('2d').drawImage(orig,0,0,tiny.width,tiny.height);tc.imageSmoothingEnabled=false;tc.drawImage(tiny,0,0,w,h)}else if(effect==='blur'){tc.filter=`blur(${Math.round(2+strength*.42)}px)`;tc.drawImage(orig,0,0);tc.filter='none'}else{const image=tc.createImageData(w,h),a=image.data;for(let i=0;i<a.length;i+=4){const v=Math.floor(Math.random()*256);a[i]=v;a[i+1]=v;a[i+2]=v;a[i+3]=255}tc.putImageData(image,0,0)}const alpha=document.createElement('canvas');alpha.width=w;alpha.height=h;const ac=alpha.getContext('2d');const mdata=dilate(mask.selected,mask.w,mask.h,Math.round(+$('padding').value*mask.w/w));const low=document.createElement('canvas');low.width=mask.w;low.height=mask.h;const lc=low.getContext('2d');const mi=lc.createImageData(mask.w,mask.h);for(let i=0;i<mdata.length;i++){mi.data[i*4]=255;mi.data[i*4+1]=255;mi.data[i*4+2]=255;mi.data[i*4+3]=mdata[i]}lc.putImageData(mi,0,0);ac.imageSmoothingEnabled=false;ac.drawImage(low,0,0,w,h);tc.globalCompositeOperation='destination-in';tc.drawImage(alpha,0,0);tc.globalCompositeOperation='source-over';pc.drawImage(temp,0,0)}
$('file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const bmp=await createImageBitmap(file);source=bmp;const max=1600,scale=Math.min(1,max/Math.max(bmp.width,bmp.height));orig.width=Math.round(bmp.width*scale);orig.height=Math.round(bmp.height*scale);oc.drawImage(bmp,0,0,orig.width,orig.height);$('previewPanel').style.display='block';mask=null;showOriginal=false;schedule();await detect()}catch(e){status('Could not open image: '+e.message)}});document.querySelectorAll('[data-effect]').forEach(btn=>btn.addEventListener('click',()=>{effect=btn.dataset.effect;document.querySelectorAll('[data-effect]').forEach(b=>b.classList.toggle('active',b===btn));schedule()}));['strength','padding'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='strength')$('strengthValue').textContent=$(id).value;schedule()}));['face','body','hair','clothes'].forEach(id=>$(id).addEventListener('change',detect));$('detect').onclick=detect;$('reset').onclick=()=>{showOriginal=!showOriginal;$('reset').textContent=showOriginal?'Show censored':'Original';schedule()};$('save').onclick=()=>{if(!source)return;if(!mask){status('Cannot save as censored: AI detection has not succeeded. Open this page through HTTPS and tap Re-detect.');return}showOriginal=false;render();preview.toBlob(blob=>{if(!blob){status('Could not save image');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='skin-mask-censored.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)},'image/png')};
</script></body></html>
